<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Happy 50th Birthday, Mummy</title>
<meta name="description" content="Eighteen photographs and twelve letters, for her fiftieth birthday.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#letters">Skip to the twelve letters</a>

<div class="selvedge weave" aria-hidden="true"></div>

<main id="top">
  <header id="masthead" class="field" data-tone="green" aria-labelledby="greeting"></header>

  <div id="chapters"></div>

  <section id="letters" class="field letters" data-tone="cloth" aria-labelledby="letters-title"></section>

  <footer id="closing" class="field" data-tone="green"></footer>
</main>

<div id="reader" class="reader" hidden></div>

<noscript>
  <div class="noscript">
    <p>This page puts itself together from the family's own file of photographs and letters, so it needs JavaScript switched on in your browser. If you are seeing this, please open the link again in Chrome or Safari.</p>
  </div>
</noscript>

<script src="../data/content.js"></script>
<script src="app.js"></script>
</body>
</html>
