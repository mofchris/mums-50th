<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 50th Birthday, Mummy</title>
<meta name="description" content="Eighteen photographs and twelve letters, laid out on a table for her fiftieth birthday.">
<meta name="theme-color" content="#2B180D">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="table.css">
</head>
<body>

<a class="skip" href="#letters">Skip to the letters</a>

<div class="table">
  <main id="top">

    <header class="hero" id="hero"></header>

    <section class="album" id="album" aria-labelledby="album-title">
      <h2 class="section-title" id="album-title">Eighteen photographs</h2>
      <div class="album__chapters" id="chapters"></div>
    </section>

    <section class="letters" id="letters" aria-labelledby="letters-title">
      <h2 class="section-title" id="letters-title">Twelve letters</h2>
      <nav class="slip" id="slip" aria-labelledby="slip-title">
        <h3 class="slip__title" id="slip-title">Everyone who wrote</h3>
        <ul class="slip__list" id="slip-list"></ul>
      </nav>
      <div class="letters__pile" id="pile"></div>
    </section>

    <footer class="close" id="close"></footer>

  </main>
</div>

<noscript>
  <p class="noscript">This page needs JavaScript switched on to lay out the photographs and the letters.</p>
</noscript>

<dialog class="reader" id="reader" aria-labelledby="reader-author">
  <div class="reader__paper">
    <div class="reader__bar">
      <p class="reader__from" id="reader-relation"></p>
      <button type="button" class="reader__close" id="reader-close-top">Close</button>
    </div>
    <article class="reader__body" id="reader-body" tabindex="-1"></article>
    <div class="reader__foot">
      <button type="button" class="reader__close reader__close--foot" id="reader-close-bottom">Close this letter</button>
    </div>
  </div>
</dialog>

<script src="data/content.js"></script>
<script src="table.js"></script>
</body>
</html>
